name: Release

on:
  push:
    tags:
      - 'v*'
  # Rebuild the release for an existing tag without moving it
  # (moving a tag would change the AUR source checksum)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.2.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git rust cargo gtk4 gtk4-layer-shell libadwaita cairo pkg-config base-devel

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: cargo build --release

      - name: Package binary
        run: |
          VERSION=${TAG#v}
          mkdir -p dist
          cp target/release/rust-discord-overlay dist/
          cp assets/icon.svg dist/
          cp assets/rust-discord-overlay.desktop dist/
          tar czf dist/rust-discord-overlay-${VERSION}-x86_64.tar.gz \
            -C dist rust-discord-overlay icon.svg rust-discord-overlay.desktop

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/rust-discord-overlay-*-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
